<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>Not found · Weibo Li</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    var dark = saved ? saved === 'dark'
      : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
  })();
  </script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="page">
  <section class="hero">
    <div class="prompt-line"><span class="p">weber@asu</span><span class="c">:~$</span> cd <span class="missing-path"></span></div>
    <h1 class="name">404</h1>
    <p class="statement">No such file or directory.</p>
    <div class="bio"><p><a href="/">Back to liweibo.io</a></p></div>
  </section>
</div>
<script>document.querySelector('.missing-path').textContent = location.pathname;</script>
</body>
</html>
